<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Build Accelerator - Metrics Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 20px;
    }
    .header {
      margin-bottom: 30px;
      border-bottom: 2px solid #007acc;
      padding-bottom: 10px;
    }
    h1 { color: #007acc; }
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .metric-card {
      background: #252526;
      border: 1px solid #3e3e42;
      border-radius: 8px;
      padding: 20px;
    }
    .metric-card h3 {
      color: #569cd6;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .metric-value {
      font-size: 32px;
      font-weight: bold;
      color: #4ec9b0;
    }
    .metric-label {
      font-size: 12px;
      color: #858585;
      margin-top: 5px;
    }
    #status {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4ec9b0;
      margin-left: 10px;
    }
    #status.disconnected { background: #f48771; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Build Accelerator Metrics <span id="status"></span></h1>
    <p>Real-time build cache performance monitoring</p>
  </div>

  <div class="metrics-grid">
    <div class="metric-card">
      <h3>Cache Hit Rate</h3>
      <div class="metric-value" id="cacheHitRate">0%</div>
      <div class="metric-label">Percentage of builds served from cache</div>
    </div>

    <div class="metric-card">
      <h3>Time Saved</h3>
      <div class="metric-value" id="timeSaved">0m</div>
      <div class="metric-label">Total build time saved today</div>
    </div>

    <div class="metric-card">
      <h3>Active Peers</h3>
      <div class="metric-value" id="activePeers">0</div>
      <div class="metric-label">Connected build nodes</div>
    </div>

    <div class="metric-card">
      <h3>Total Builds</h3>
      <div class="metric-value" id="totalBuilds">0</div>
      <div class="metric-label">Builds processed this session</div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const cacheHitEl = document.getElementById('cacheHitRate');
    const timeSavedEl = document.getElementById('timeSaved');
    const activePeersEl = document.getElementById('activePeers');
    const totalBuildsEl = document.getElementById('totalBuilds');

    let ws;

    function connect() {
      ws = new WebSocket(`ws://${window.location.host}`);

      ws.onopen = () => {
        statusEl.classList.remove('disconnected');
        console.log('Connected to metrics stream');
      };

      ws.onmessage = (event) => {
        const metrics = JSON.parse(event.data);
        cacheHitEl.textContent = `${(metrics.cacheHitRate * 100).toFixed(1)}%`;
        timeSavedEl.textContent = `${Math.floor(metrics.buildTimeSaved / 60)}m`;
        activePeersEl.textContent = metrics.activePeers;
        totalBuildsEl.textContent = metrics.totalBuilds;
      };

      ws.onerror = (error) => {
        console.error('WebSocket error:', error);
      };

      ws.onclose = () => {
        statusEl.classList.add('disconnected');
        console.log('Disconnected, retrying in 5s...');
        setTimeout(connect, 5000);
      };
    }

    connect();
  </script>
</body>
</html>
